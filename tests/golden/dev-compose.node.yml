name: zc-lailiao-dev
networks:
  default: {}
  zcnet:
    external: true
services:
  migrate:
    image: zerocode-sqlrunner:2
    environment:
      TARGET_DB: ${DEV_DB}
      TARGET_USER: ${DEV_USER}
      TARGET_PASSWORD: ${DEV_PASSWORD}
      TARGET_ENV: dev
    volumes:
      - ../schema:/schema:ro
      - ../sqlchange:/sql:ro
    networks: [zcnet]
    restart: "no"

  backend:
    image: node:20-alpine
    working_dir: /src
    volumes:
      - ../backend:/src
      - be_node_modules:/src/node_modules
    environment:
      DATABASE_URL: postgresql://${DEV_USER}:${DEV_PASSWORD}@zerocode-pg16:5432/${DEV_DB}
      APP_PORT: "8000"
    command: sh -c "npm install && npm run dev"
    networks: [default, zcnet]
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    image: node:20-alpine
    working_dir: /src
    volumes:
      - ../frontend:/src
      - fe_node_modules:/src/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "8211:5173"
    depends_on:
      - backend
volumes:
  fe_node_modules: {}
  be_node_modules: {}
