server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 应用后端反代：context-path 已是 /api，URI 原样透传（proxy_pass 不带路径段）
    # 上传件回读也在这一条里：后端把资源挂在 context 内的 /uploads/**，对外 URL 就是 /api/uploads/**
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 与 spring.servlet.multipart.max-request-size 对齐，否则大文件先在网关层 413
        client_max_body_size 50m;
    }

    # 移动端 H5：与后台管理系统同源同端口，只靠路径分流（ADR-0039）。
    # 产物落在 html/h5 下，所以用 root 拼接而不是 alias——alias + try_files 是 nginx 的经典坑位。
    location /h5/ {
        try_files $uri $uri/ /h5/index.html;
    }

    # 少一个斜杠就整页 404（hash 路由只认 /h5/ 这一个入口），301 比让用户自己补更省事
    location = /h5 {
        return 301 /h5/;
    }

    # SPA 路由回落（history 模式刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
