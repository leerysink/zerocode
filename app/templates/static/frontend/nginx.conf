server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 本栈没有后端，因此这里没有任何反代 location。少写不是省事：nginx 在启动期就要解析 upstream
    # 主机名，指到一个不存在的容器是整台容器直接起不来（不是 404，是根本不起），发布体检只会报
    # 「前端未就绪」。平台的存量补齐 _ensure_prod_proxy_conf 按栈取模板，也不会把反代补进来。

    # SPA 路由回落（history 模式刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
