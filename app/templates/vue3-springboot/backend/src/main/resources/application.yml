# 单一配置：环境差异全部外置为平台注入的环境变量。
# 标量后不带 `:默认值` 的键（数据源三项、SPRING_DATA_REDIS_HOST、JWT_SECRET、UPLOAD_DIR）一旦
# 缺失，应用启动即失败——刻意不留「静默连上本地库 / 用仓库公开密钥签 token」的降级路径。
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: {{SLUG}}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          # 必须显式开启：不开则依赖 Boot 从「pool 节点被写过」隐式推断，将来有人删下三行就会静默退化为非池化
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1
          # 默认 -1（池耗尽时无限阻塞），给上限让耗尽时快速失败而不是挂住请求线程
          max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zerocode.app.entity
  configuration:
    map-underscore-to-camel-case: true
    # 默认不打 SQL 日志；预览期想看 SQL 就地改成 StdOutImpl（本文件在应用工程内，AI 可编辑）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 探针与前端同前缀：context-path(/api) + base-path(/) => GET /api/health
# 只放开 health，绝不暴露 env/beans/metrics
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  header: Authorization
  token-prefix: "Bearer "

file:
  allowed-types: jpg,jpeg,png,gif,bmp,webp,pdf
  max-size: 10485760
  upload-dir: ${UPLOAD_DIR}

# 接口文档默认关。要开改三处：下面两个 enabled 置 true + knife4j.production 置 false
# （屏蔽文档的是 production，不是 enable）；SecurityConfig 已预先放开 /doc.html、/swagger-ui/**、
# /v3/api-docs/**、/webjars/**，无需再改。对外地址带 context 前缀：/api/doc.html
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
  production: true

logging:
  path: ${LOG_PATH:${user.dir}/logs}
  max-history: 180
  max-file-size: 100MB
  level:
    com.zerocode.app: info
