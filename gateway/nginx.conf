# 平台中央网关（通配域名 HTTPS）。全站唯一持有 TLS 的地方。
# 应用容器保持纯 HTTP listen 80，本网关按 {slug}.<GATEWAY_DOMAIN> 反代到其 prod 宿主端口。
# 路由数据源是平台导出的 routes.json（volume 挂载），lua 按内容变化刷新，免 reload。
#
# 域名一律不写死在本文件：server_name 用 catch-all（真正的主机名分发在 lua 里做），
# 证书用与域名无关的固定文件名，域名本身经 env GATEWAY_DOMAIN 传给 lua。

worker_processes auto;

# 供 lua 读取的可调参数（docker-compose 里设环境变量即可，无需改本文件）
# 每一条都必须在这里声明：nginx 默认会清空继承来的环境，未声明的变量在 lua 里
# os.getenv 拿到的是 nil——不报错，只是静默退回默认值。
env UPSTREAM_HOST;     # 应用到宿主端口的入口。必须是 IP 字面量才算「不经 DNS」：本机 Docker
                       # Desktop 用 host.docker.internal，Linux 服务器用 docker0 网关（打包默认
                       # 172.17.0.1）——nginx 的 resolver 不读 /etc/hosts，别名在 Linux 上解析不了
env ROUTES_PATH;       # routes.json 在容器内的挂载路径
env GATEWAY_DOMAIN;    # 域名后缀；必须与平台侧 ZEROCODE_GATEWAY_DOMAIN 一致

events {
    worker_connections 4096;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict routes_cache 128k;

    # 上游 host 走 Docker 内嵌 DNS 解析（host.docker.internal）；127.0.0.1 为 IP 字面量不经 DNS
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ---- 80：一律 301 跳到对应的 https ----
    # server_name 用 catch-all：443/80 上只有本网关，而「这个主机名归哪个应用」已经由
    # lua 根据 routes.json 判定了，再在 server_name 里写死域名只会多一份需要跟着改的硬编码。
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- 443：终止 TLS + 按子域名动态路由 ----
    server {
        listen 443 ssl;
        server_name _;

        # 文件名与域名无关：自签（gateway/make-cert）与 Let's Encrypt（acme.sh --install-cert）
        # 写到同一对名字上，换域名或换 CA 都不用改本文件。
        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # proxy_pass 用变量即走动态解析；upstream 由 lua 在 access 阶段算出
        set $zerocode_upstream "";

        location / {
            access_by_lua_block {
                require("router").dispatch()
            }

            proxy_pass http://$zerocode_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
