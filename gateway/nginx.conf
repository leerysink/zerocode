# 平台中央网关（通配域名 HTTPS）。全站唯一持有 TLS 的地方。
# 应用容器保持纯 HTTP listen 80，本网关按 {slug}.zerocode.com 反代到其 prod 宿主端口。
# 路由数据源是平台导出的 routes.json（volume 挂载），lua 按内容变化刷新，免 reload。

worker_processes auto;

# 供 lua 读取的可调参数（docker-compose 里设环境变量即可，无需改本文件）
env UPSTREAM_HOST;     # 应用到宿主端口的入口：本机 host.docker.internal，同机可回退 127.0.0.1
env ROUTES_PATH;       # routes.json 在容器内的挂载路径

events {
    worker_connections 4096;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict routes_cache 128k;

    # 上游 host 走 Docker 内嵌 DNS 解析（host.docker.internal）；127.0.0.1 为 IP 字面量不经 DNS
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ---- 80：一律 301 跳到对应的 https ----
    server {
        listen 80;
        server_name .zerocode.com;
        return 301 https://$host$request_uri;
    }

    # ---- 443：终止 TLS + 按子域名动态路由 ----
    server {
        listen 443 ssl;
        server_name .zerocode.com;

        ssl_certificate     /etc/nginx/certs/wildcard.zerocode.com.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.zerocode.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # proxy_pass 用变量即走动态解析；upstream 由 lua 在 access 阶段算出
        set $zerocode_upstream "";

        location / {
            access_by_lua_block {
                require("router").dispatch()
            }

            proxy_pass http://$zerocode_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
